[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crepo"
version = "1.2.0"
description = "Copy a curated bundle of repository text files to the clipboard."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nithin Kumar" }]
keywords = ["clipboard", "developer-tools", "repository"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pyperclip>=1.8"]

[project.scripts]
crepo = "crepo.main:main"

[project.urls]
Repository = "https://github.com/NiTHIN-K/clip-repo"
Issues = "https://github.com/NiTHIN-K/clip-repo/issues"

[tool.setuptools.packages.find]
include = ["crepo*"]
